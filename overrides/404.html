<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · ACCESS DENIED</title>
    <link rel="stylesheet" href="theme/css/main.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020408;
            color: #e2e2f0;
            font-family: 'JetBrains Mono', 'Inter', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: crosshair;
        }
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: 0; }

        .glitch-overlay {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: repeating-linear-gradient(0deg,
                rgba(0,212,255,0.02) 0px,
                transparent 2px,
                transparent 4px);
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        .container {
            position: relative; z-index: 2; text-align: center;
            background: rgba(4,6,18,0.85);
            border: 1px solid rgba(0,212,255,0.2);
            padding: 3rem 2.5rem;
            max-width: 520px;
            animation: borderPulse 3s ease-in-out infinite;
        }
        @keyframes borderPulse {
            0%,100% { border-color: rgba(0,212,255,0.2); box-shadow: 0 0 30px rgba(0,212,255,0.05); }
            50% { border-color: rgba(0,212,255,0.5); box-shadow: 0 0 60px rgba(0,212,255,0.15); }
        }

        .status-bar {
            display: flex; align-items: center; gap: 0.5rem;
            color: #00ff88; font-size: 0.7rem; margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #00ff88;
            box-shadow: 0 0 8px #00ff88; animation: blink 1.2s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

        .error-glitch {
            font-size: clamp(4rem, 10vw, 7rem);
            font-weight: 900;
            position: relative;
            display: inline-block;
            color: #00d4ff;
            text-shadow: 0 0 40px rgba(0,212,255,0.4);
        }
        .error-glitch::before,
        .error-glitch::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }
        .error-glitch::before {
            color: #ff2d95; z-index: -1;
            animation: glitchShift 0.4s infinite alternate-reverse;
        }
        .error-glitch::after {
            color: #00d4ff; z-index: -2;
            animation: glitchShift 0.3s infinite alternate;
        }
        @keyframes glitchShift {
            0% { transform: translate(0); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -1px); }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, 1px); }
        }

        .msg {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #606090;
            margin: 1rem 0 2rem;
            line-height: 1.8;
        }
        .msg .cyan { color: #00d4ff; }
        .msg .pink { color: #ff2d95; }
        .msg .green { color: #00ff88; }

        .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: transparent;
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }
        .btn-primary:hover {
            background: #00d4ff;
            color: #020408;
            box-shadow: 0 0 30px rgba(0,212,255,0.5), inset 0 0 30px rgba(0,212,255,0.1);
        }
        .btn-ghost {
            background: transparent;
            color: #606090;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-ghost:hover {
            border-color: #ff2d95;
            color: #ff2d95;
            box-shadow: 0 0 20px rgba(255,45,149,0.3);
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: #404060;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="glitch-overlay"></div>

    <div class="container">
        <div class="status-bar">
            <div class="status-dot"></div>
            <span>SYSTEM://ACCESS_DENIED</span>
        </div>

        <div class="error-glitch" data-text="404">404</div>

        <div class="msg">
            <span class="cyan">> ERROR:</span> Resource not found<br>
            <span class="pink">> PATH:</span> <span class="green" id="lostPath">/unknown</span><br>
            <span class="cyan">> STATUS:</span> Connection refused
        </div>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">[ RETURN HOME ]</a>
            <a href="javascript:history.back()" class="btn btn-ghost">[ GO BACK ]</a>
        </div>

        <div class="footer">Press any key to retry... or don't.</div>
    </div>

    <script>
        document.getElementById('lostPath').textContent = location.pathname || '/unknown';

        // ---- Canvas: 数字雨风格粒子 (简化版) ----
        (function() {
            var c = document.getElementById('bg-canvas');
            var ctx = c.getContext('2d');
            var w, h;
            var chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>/{}[]()*&^%$#@!';
            var drops = [];
            var fontSize = 14;

            function resize() {
                w = c.width = innerWidth;
                h = c.height = innerHeight;
                var cols = Math.floor(w / fontSize);
                drops = [];
                for (var i = 0; i < cols; i++) drops[i] = Math.random() * -h;
            }
            window.addEventListener('resize', resize); resize();

            function draw() {
                ctx.fillStyle = 'rgba(2,4,8,0.1)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#00d4ff';
                ctx.font = fontSize + 'px "JetBrains Mono"';
                for (var i = 0; i < drops.length; i++) {
                    var char = chars[Math.floor(Math.random() * chars.length)];
                    var x = i * fontSize;
                    var y = drops[i] * fontSize;
                    ctx.globalAlpha = Math.random() * 0.4 + 0.2;
                    ctx.fillText(char, x, y);
                    if (y > h && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
                ctx.globalAlpha = 1;
                requestAnimationFrame(draw);
            }
            draw();

            // 键盘任意键跳转首页
            document.addEventListener('keydown', function() {
                window.location.href = '/';
            });
        })();
    </script>
</body>
</html>
