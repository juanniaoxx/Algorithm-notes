site_name: Weary Bird
site_url: https://juanniaoxx.github.io/Algorithm-notes/
site_description: 代码学习文档 · 现代开发技术栈
site_author: Weary Bird

# ----- 主题配置 -----
theme:
  name: material
  custom_dir: docs/overrides                      # 自定义模板覆盖目录
  language: zh
  
  icon:
    repo: fontawesome/brands/github
  
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换至日间模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/toggle-switch
        name: 切换至夜间模式

  font:
    text: Inter
    code: JetBrains Mono

  features:
    # - navigation.instant
    - navigation.tracking
    # - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# ----- 仓库信息 -----
repo_url: https://github.com/juanniaoxx/Algorithm-notes
repo_name: Weary Bird
edit_uri: edit/main/docs

# ----- 版权 -----
copyright: Copyright &copy; 2025~2026 Weary Bird

# ----- 额外配置 -----
extra:
  generator: false

# ----- 插件 -----
plugins:
  - search

# ----- Markdown 扩展 -----
markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.caret
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: false
      linenums: false
      auto_title: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

# ----- 自定义 CSS（CyberDev 主题） -----
extra_css:
  - theme/css/main.css
  - https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.css

# ----- 自定义 JS（CyberDev 主题） -----
extra_javascript:
  - theme/js/main.js
  - theme/js/video-player.js
  - https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js
  - theme/js/pdf-viewer.js